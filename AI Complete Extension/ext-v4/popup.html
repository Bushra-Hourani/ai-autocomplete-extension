<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8"/>
<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { width:280px; font-family:Arial,sans-serif; background:#1a1a2e; color:#eee; padding:16px; }
.title { font-size:15px; font-weight:bold; color:#a78bfa; margin-bottom:4px; }
.sub { font-size:11px; color:#666; margin-bottom:14px; }
label { font-size:11px; color:#aaa; display:block; margin-bottom:5px; }
input { width:100%; padding:8px 10px; background:#2d2d44; border:1px solid #444; border-radius:6px; color:#eee; font-size:12px; font-family:monospace; outline:none; margin-bottom:6px; }
input:focus { border-color:#7c3aed; }
.link { font-size:11px; color:#7c3aed; text-decoration:none; display:block; margin-bottom:14px; }
button { width:100%; padding:9px; background:#7c3aed; border:none; border-radius:6px; color:white; font-size:13px; cursor:pointer; }
button:hover { background:#6d28d9; }
.msg { text-align:center; font-size:11px; margin-top:8px; min-height:16px; color:#4ade80; }
.info { margin-top:12px; padding:10px; background:#2d2d44; border-radius:6px; font-size:11px; color:#888; line-height:1.8; }
.info b { color:#a78bfa; }
.badge { display:inline-block; background:#1e3a2f; color:#4ade80; padding:2px 6px; border-radius:4px; font-size:10px; margin-left:4px; }
</style>
</head>
<body>
  <div class="title">✦ AI Autocomplete v4</div>
  <div class="sub">Works on any site + Google Docs <span class="badge">NEW</span></div>
  <label>Gemini API Key (optional)</label>
  <input type="password" id="key" placeholder="AIzaSy..."/>
  <a class="link" href="https://aistudio.google.com/app/apikey" target="_blank">→ Get free key</a>
  <button id="save">Save</button>
  <div class="msg" id="msg"></div>
  <div class="info">
    <b>How to use:</b><br>
    Type in any text box → wait 1 sec<br>
    Press <b>Tab</b> to accept ✓<br>
    Press <b>Esc</b> to dismiss ✗<br><br>
    <b>Google Docs:</b> Type → wait → gray text appears inline → Tab ✓
  </div>
  <script src="popup.js"></script>
</body>
</html>
